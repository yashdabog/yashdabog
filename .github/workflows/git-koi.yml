name: Git Koi

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install git-koi
        run: cargo install git-koi

      - name: Run git-koi
        run: git-koi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update git-koi profile graphic"
          file_pattern: "*.gif"
