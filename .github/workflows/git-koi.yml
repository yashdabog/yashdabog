name: Git Koi

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and setup git-koi binary
        run: |
          # Download the latest Linux x86_64 binary release
          curl -sL https://github.com/1yalongwastaken/git-koi/releases/latest/download/git-koi-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x git-koi
          ./git-koi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated GIF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update git-koi profile graphic"
          file_pattern: "*.gif"
